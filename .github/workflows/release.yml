# A tag like v1.4.0 builds the container image for amd64 and arm64 (Raspberry
# Pi 4 and 5 with a 64-bit OS, any x86 box), pushes it to GitHub's registry,
# and attaches a source zip to the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source zip without the development files
        run: |
          name="aircraft-noise-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" HEAD \
            ':!tests' ':!docs/plans' ':!.github' ':!to_be_deleted'
          ls -l "$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: aircraft-noise-*.zip
          generate_release_notes: true
